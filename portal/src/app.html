<!doctype html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="icon" href="/logo-square.png" />
    <title>Vava Bot4Bots Cup</title>
    %sveltekit.head%
    <style>
      :root { --val-red: #ff4655; --val-dark: #0f1923; --val-panel: #1b1e2b; }
      body { background: #0f1923; }
      .bg-val-panel { background: #1b1e2b; }
      .text-val-red { color: #ff4655; }
      .text-val-gold { color: #ffd700; }
      .border-val { border-color: #2a2a4e !important; }
      .btn-val { background: #ff4655; border-color: #ff4655; color: white; font-weight: 600; }
      .btn-val:hover { background: #ff6b7a; border-color: #ff6b7a; color: white; }
      .navbar { background: #141824 !important; border-bottom: 2px solid #ff4655; padding: 0.5rem 0; }
      .navbar .nav-link { color: #aaa; text-transform: uppercase; font-size: 0.85rem; font-weight: 600; letter-spacing: 0.5px; }
      .navbar .nav-link:hover, .navbar .nav-link.active { color: #ff4655; }
      .card { background: #1b1e2b; border: 1px solid #2a2a4e; }
      .table { --bs-table-bg: #1b1e2b; --bs-table-border-color: #2a2a4e; color: #ddd; }
      .table thead th { color: #888; font-size: 0.8rem; text-transform: uppercase; border-bottom: 2px solid #ff4655; }
      .winner-text { color: #4ade80 !important; font-weight: 700; }
      .loser-text { color: #f87171 !important; }
      .match-card { background: #1b1e2b; border: 1px solid #2a2a4e; border-radius: 8px; }
      .match-card.completed { border-color: #166534; }
      .match-card.bye { opacity: 0.35; }
      footer { border-top: 1px solid #1b1e2b; }
      .logo-img { height: 56px; }
    </style>
  </head>
  <body class="min-vh-100 d-flex flex-column">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
